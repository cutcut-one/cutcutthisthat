name: run-cluster
run-name: issue-${{ inputs.issue }} ${{ inputs.runs_on }}
on:
  workflow_dispatch:
    inputs:
      issue: { required: true }
      platform: { required: true }
      runs_on: { required: true }
concurrency: { group: 'issue-${{ inputs.issue }}' }
permissions: { contents: read, actions: write }
jobs:
  run:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 358
    defaults: { run: { shell: bash } }
    env:
      GH_TOKEN: ${{ secrets.VIBECUT_PAT }}
      REPO: nguyenphp/vibecut
      ISSUE: ${{ inputs.issue }}
      PLATFORM: ${{ inputs.platform }}
      # Telegram: 1 bot riêng mỗi tài khoản Claude (TG_BOT_TOKEN_1..3) hoặc 1 bot chung; thiếu thì không báo.
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_BOT_TOKEN_1: ${{ secrets.TG_BOT_TOKEN_1 }}
      TG_BOT_TOKEN_2: ${{ secrets.TG_BOT_TOKEN_2 }}
      TG_BOT_TOKEN_3: ${{ secrets.TG_BOT_TOKEN_3 }}
      # SDK quảng cáo Tevo (io.mmonetize) nằm ở Nexus riêng; thiếu thì gradle không resolve được.
      ORG_GRADLE_PROJECT_tevoNexusMavenUrl: ${{ secrets.TEVO_NEXUS_URL }}
      ORG_GRADLE_PROJECT_tevoNexusUsername: ${{ secrets.TEVO_NEXUS_USERNAME }}
      ORG_GRADLE_PROJECT_tevoNexusPassword: ${{ secrets.TEVO_NEXUS_PASSWORD }}
    # Repo này PUBLIC: log ai cũng đọc được. Không bước nào được in code/diff/output Claude.
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/checkout@v4
        with: { repository: nguyenphp/vibecut, token: '${{ secrets.VIBECUT_PAT }}', path: vibecut, fetch-depth: 1 }

      - name: git
        working-directory: vibecut
        run: |
          git config core.hooksPath .githooks
          git config user.name cutcut-runner
          git config user.email 62367533+nguyenphp@users.noreply.github.com

      - name: xcode
        if: inputs.platform == 'ios' || inputs.platform == 'mac'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version
      - uses: actions/setup-java@v4
        if: inputs.platform == 'android'
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: claude + superpowers
        run: |
          npm i -g --silent @anthropic-ai/claude-code
          claude plugin marketplace add anthropics/claude-plugins-official >/dev/null
          claude plugin install superpowers@claude-plugins-official >/dev/null && echo "superpowers ok"

      # Máy ảo để Claude CHẠY APP thật + chụp hình. Boot nền, Claude tự chờ (adb wait-for-device / simctl bootstatus).
      - name: device
        run: |
          mkdir -p /tmp/shots
          case "$PLATFORM" in
            android)
              echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
              sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
              echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"; echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
              img="system-images;android-34;google_apis;x86_64"
              (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$img" emulator platform-tools >/dev/null 2>&1
              echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n ci -k "$img" -d pixel_6 >/dev/null
              nohup "$ANDROID_HOME/emulator/emulator" -avd ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/emu.log 2>&1 &
              echo "emulator đang boot" ;;
            ios)
              udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][-1].udid')
              # KHÔNG boot sẵn (ăn ~1.5GB RAM suốt lúc build); Claude boot khi tới bước chạy app: xcrun simctl boot $SIM_UDID
              echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
              brew install -q cameroncooke/axe/axe >/dev/null 2>&1 && echo "axe ok" || echo "không có axe" ;;
            *) echo "không cần máy ảo" ;;
          esac

      # 1 job chạy trọn ~6 tiếng: xong issue này còn giờ thì nhận tiếp issue chờ cùng nền tảng.
      - name: claude
        working-directory: vibecut
        timeout-minutes: 335
        continue-on-error: true
        env:
          # 3 tài khoản Claude (claude setup-token mỗi acc) + secret cũ nếu còn; rỗng thì bỏ qua.
          TOK_1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_1 }}
          TOK_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_2 }}
          TOK_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_3 }}
          TOK_0: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Build/test iOS sạch lần đầu > 10 phút: nới trần lệnh Bash lên 60 phút để Claude chạy THẲNG, không đẩy nền.
          BASH_DEFAULT_TIMEOUT_MS: '3600000'
          BASH_MAX_TIMEOUT_MS: '3600000'
          # Không ai "gọi dậy" trên CI: tắt hẳn chạy nền (run_in_background) — bot từng đẩy test nền rồi chờ, phiên chết (#86).
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        run: |
          export DEADLINE=$(( $(date +%s) + 330 * 60 ))
          export TEST_CMD=$(jq -r --arg p "$PLATFORM" '.[$p].test' ../runner/platforms.json)
          toks=(); nos=(); i=0; for t in "$TOK_1" "$TOK_2" "$TOK_3" "$TOK_0"; do i=$((i+1)); [ -n "$t" ] && { toks+=("$t"); nos+=($(( i % 4 ))); }; done
          [ ${#toks[@]} -gt 0 ] || { echo "thiếu secret CLAUDE_CODE_OAUTH_TOKEN_1..3"; exit 1; }
          # Rải issue đều cho các tài khoản; acc hết hạn mức thì đổi acc kế tiếp, hết cả thì dừng. Không in token.
          source ../runner/scripts/lib.sh
          # Bot làm issue = nhãn bot:* (trưởng nhóm gắn lúc giao); thiếu nhãn thì rải theo số issue.
          pick() { local b; b=$(bot_no_from_labels ",$(gh issue view "$ISSUE" -R "$REPO" --json labels -q '[.labels[].name]|join(",")'),")
            ti=$(( ISSUE % ${#toks[@]} )); for k in "${!nos[@]}"; do if [ "${nos[$k]}" = "$b" ]; then ti=$k; fi; done; return 0; }
          pick; tried=0
          while :; do
            export CLAUDE_CODE_OAUTH_TOKEN="${toks[$ti]}" BOT_NO="${nos[$ti]}"
            if ! bash ../runner/scripts/work-issue.sh; then
              tried=$((tried + 1))
              [ $tried -ge ${#toks[@]} ] && { echo "hết hạn mức cả ${#toks[@]} tài khoản Claude, dừng runner"; peak=0; for t in "${toks[@]}"; do peak_paused "$t" && peak=$((peak + 1)); done; [ $peak -ge ${#toks[@]} ] || bash ../runner/scripts/tg.sh "⏸ **Cả ${#toks[@]} tài khoản hết hạn mức** — runner tạm dừng, tự chạy lại khi có hạn mức"; break; }
              ti=$(( (ti + 1) % ${#toks[@]} )); echo "tài khoản hết hạn mức → đổi sang tài khoản #$((ti + 1))"; continue
            fi
            tried=0
            [ $(( DEADLINE - $(date +%s) )) -lt 1800 ] && { echo "còn dưới 30 phút, không nhận thêm"; break; }
            next=$(bash ../runner/scripts/claim-next.sh); [ -n "$next" ] || { echo "hết issue chờ"; break; }
            export ISSUE=$next; echo "nhận tiếp issue #$ISSUE"
            pick
          done

      # Job bị cắt ngang (hết giờ/huỷ) giữa issue: đẩy phần đã commit, nhả label để lượt sau làm tiếp.
      - name: release
        if: always()
        working-directory: vibecut
        run: |
          [ -f /tmp/current_issue ] || exit 0
          i=$(cat /tmp/current_issue)
          git push -q origin "HEAD:ci/issue-$i" 2>/dev/null || true
          gh issue edit "$i" -R "$REPO" --remove-label ci-running >/dev/null || true
          gh issue comment "$i" -R "$REPO" --body "Runner: job bị cắt ngang (hết giờ hoặc huỷ). Phần đã commit nằm ở nhánh ci/issue-$i, task chưa tick sẽ được làm tiếp lượt sau." >/dev/null
          echo "issue #$i: nhả do job bị cắt"

      - name: board
        if: always()
        working-directory: runner
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: '[ -n "$GH_TOKEN" ] && bash scripts/project-sync.sh || echo "chưa có PROJECT_TOKEN"'

      # Chạy 24/7: runner xong là gọi bộ điều phối ngay, khỏi chờ lịch 30 phút.
      - name: next
        if: always()
        working-directory: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dispatch.yml -R "$GITHUB_REPOSITORY" && echo "đã gọi bộ điều phối" || echo "gọi bộ điều phối lỗi, cron sẽ chạy"
