name: batch-queue
# Starts the next queued batch run (repo variable BATCH_QUEUE = JSON list of input objects) once no batch run is active.
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
jobs:
  next:
    runs-on: ubuntu-latest
    env: { GH_TOKEN: '${{ secrets.BATCH_TOKEN }}', R: '${{ github.repository }}', Q: '${{ vars.BATCH_QUEUE }}' }
    steps:
      - run: |
          [ -n "$Q" ] && [ "$(jq length <<<"$Q")" -gt 0 ] || { echo "queue empty"; exit 0; }
          busy=$(gh run list -R "$R" -w batch.yml --json status,displayTitle --jq '[.[]|select(.status!="completed" and (.displayTitle|test(" shot ")|not))]|length')
          [ "$busy" -lt "${MAXRUNS:-4}" ] || { echo "busy $busy"; exit 0; }  # ponytail: tối đa MAXRUNS lượt song song; max-parallel từng lượt + trần org tự giới hạn máy
          args=$(jq -r '.[0]|to_entries|map("-f \(.key)=\(.value|@sh)")|join(" ")' <<<"$Q")
          eval gh workflow run batch.yml -R "$R" $args
          gh variable set BATCH_QUEUE -R "$R" -b "$(jq -c '.[1:]' <<<"$Q")"
          echo "started 1, left $(jq '.[1:]|length' <<<"$Q")"
