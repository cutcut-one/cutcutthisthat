name: windows-shots
# Chụp các màn app desktop trên máy Windows của GitHub (#208): build nhánh desktop/main, chụp từng màn,
# đẩy ảnh vào nhánh ci-shots (repo private) + Telegram + comment vào issue. Log PUBLIC: không in nội dung ảnh.
on:
  workflow_dispatch:
    inputs:
      issue: { description: 'Issue nhận ảnh', default: '208' }
      ref: { description: 'Nhánh vibecut', default: 'desktop/main' }
      skip_tests: { description: 'Chỉ build, bỏ ctest (~1 giờ)', type: boolean, default: false }
permissions: { contents: read }
jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 300   # lần đầu vcpkg build ffmpeg/opencv/x264/x265 từ nguồn ~1.5–2 giờ; có cache thì vài phút
    defaults: { run: { shell: bash } }
    env:
      GH_TOKEN: ${{ secrets.VIBECUT_PAT }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
      TG_BOT_TOKEN_1: ${{ secrets.TG_BOT_TOKEN_1 }}
      BOT_NO: '1'
    steps:
      - uses: actions/checkout@v4
        with: { path: runner }
      - uses: actions/checkout@v4
        with: { repository: nguyenphp/vibecut, token: '${{ secrets.VIBECUT_PAT }}', ref: '${{ inputs.ref }}', path: vc, fetch-depth: 1 }
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/Qt
            ~/AppData/Local/vcpkg/archives
          key: win-qt-vcpkg-${{ hashFiles('vc/desktop/vcpkg.json') }}
          restore-keys: win-qt-vcpkg-
      - name: cài + build + test
        id: build
        working-directory: vc
        run: |
          source desktop/ci/setup-windows.sh
          if [ "${{ inputs.skip_tests }}" = true ]; then (cd desktop && cmake --preset ci-windows && cmake --build --preset ci-windows)
          else bash desktop/ci/test.sh; fi
      # Lưu cache cả khi build/test đỏ: lượt sau khỏi build lại ffmpeg/opencv.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/Qt
            ~/AppData/Local/vcpkg/archives
          key: win-qt-vcpkg-${{ hashFiles('vc/desktop/vcpkg.json') }}-${{ github.run_id }}
      # Chụp cả khi test đỏ (vd ui_compare_screens timeout vì chưa có ảnh mẫu Mac) — app đã build xong.
      - name: chụp màn
        if: ${{ !cancelled() }}
        working-directory: vc
        run: |
          source desktop/ci/setup-windows.sh >/dev/null
          # Windows build ra build/ci-windows (preset ci-windows), shot.sh mặc định tìm build/ci → chỉ thẳng exe.
          export CUTCUT_APP=$(find "$PWD/desktop/build" -name cutcut.exe -path '*ci-windows*' | head -1)
          echo "app: ${CUTCUT_APP:-KHÔNG THẤY}"
          # Backend Render free ngủ → màn editor chờ HTTP 30s/request rồi vượt trần. Đánh thức trước.
          for i in 1 2 3 4 5 6; do curl -sf -m 60 -o /dev/null "https://cutcut-backend-n7ki.onrender.com/api/v1/app-config" && { echo "backend thức"; break; }; sleep 10; done
          # Danh sách màn = mọi tên `--screenshot` app biết (main.cpp + qml).
          screens=$(grep -rhoE 'cutcutScreenshotScreen *(===|==) *"[a-z0-9-]+"|screen == QStringLiteral\("[a-z0-9-]+"\)|"(home|editor|settings|template)[a-z0-9-]*"' \
            desktop/app | grep -oE '"[a-z0-9-]+"' | tr -d '"' | sort -u)
          mkdir -p ../out; ok=0; bad=""
          for s in $screens; do
            if timeout 240 bash desktop/ci/shot.sh "$s" "../out/$s.png" >../out/last.log 2>&1 && [ -s "../out/$s.png" ]; then ok=$((ok+1))
            else bad="$bad $s"; [ -n "${shown:-}" ] || { shown=1; echo "--- lỗi màn $s (exit $?):"; tail -15 ../out/last.log; ls desktop/build 2>&1 | head; }; fi
          done; rm -f ../out/last.log
          echo "chụp được $ok màn; lỗi:${bad:- không}" | tee ../out/KETQUA.txt
      - name: đẩy ảnh + báo
        if: always()
        working-directory: vc
        run: |
          [ -d ../out ] && ls ../out/*.png >/dev/null 2>&1 || { echo "không có ảnh"; exit 1; }
          n=${{ inputs.issue }}; dir="issue-$n/windows-$(date +%Y%m%d-%H%M)"
          git config user.name runner; git config user.email runner@users.noreply.github.com
          if git fetch -q --depth 1 origin ci-shots; then git worktree add -q ../shots FETCH_HEAD
          else git worktree add -q --detach ../shots && (cd ../shots && git checkout -q --orphan ci-shots && git rm -rfq .); fi
          mkdir -p "../shots/$dir"; cp ../out/* "../shots/$dir/"
          (cd ../shots && git add -A && git -c core.hooksPath=/dev/null commit -qm "ảnh windows #$n" && git push -q origin HEAD:ci-shots)
          bash ../runner/scripts/tg-album.sh "🪟 #$n — ảnh màn Windows" ../out/*.png
          gh issue comment "$n" -R nguyenphp/vibecut -b "🪟 Ảnh màn Windows (máy GitHub windows-latest): $(cat ../out/KETQUA.txt)
          📁 https://github.com/nguyenphp/vibecut/tree/ci-shots/$dir" >/dev/null
