# Build + test vibecut (iOS và/hoặc Android) trên máy GitHub thay cho Mac 16GB của owner.
# Log PUBLIC phải câm: chỉ in đếm/xanh-đỏ; chi tiết lỗi (đường dẫn + dòng lỗi) gửi thành comment trên commit của repo PRIVATE.
# Chạy: gh workflow run ci-ios.yml -R cutcut-one/cutcutthisthat -f ref=<nhánh> [-f tests="ClassA ClassB"] [-f platforms="ios android"]
name: ci-ios
run-name: ci ${{ inputs.ref }}
on:
  workflow_dispatch:
    inputs:
      ref: { description: 'nhánh/commit vibecut', required: true }
      tests: { description: 'lớp CutCutTests (cách bằng dấu cách); trống = chỉ build', default: '' }
      platforms: { description: 'ios android (cách bằng dấu cách)', default: 'ios android' }

jobs:
  ios:
    if: contains(inputs.platforms, 'ios')
    runs-on: macos-15
    timeout-minutes: 150
    env: { GH_TOKEN: '${{ secrets.VIBECUT_PAT }}' }
    steps:
      - uses: actions/checkout@v4
        with: { repository: nguyenphp/vibecut, ref: '${{ inputs.ref }}', token: '${{ secrets.VIBECUT_PAT }}', path: vibecut }
      - name: xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version | head -1
      - name: build + test
        working-directory: vibecut
        run: |
          sim=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][-1].udid')
          dest="platform=iOS Simulator,id=$sim"
          proj=ios/CutCut/CutCut.xcodeproj; dd=/tmp/dd
          b=0; xcodebuild build-for-testing -project $proj -scheme CutCut -destination "$dest" -derivedDataPath $dd \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO > /tmp/build.log 2>&1 || b=$?
          t=0; sum="build: $([ $b = 0 ] && echo xanh || echo ĐỎ)"
          if [ $b = 0 ] && [ -n "${{ inputs.tests }}" ]; then
            only=$(for c in ${{ inputs.tests }}; do printf -- '-only-testing:CutCutTests/%s ' "$c"; done)
            xcodebuild test-without-building -project $proj -scheme CutCut -destination "$dest" -derivedDataPath $dd $only > /tmp/test.log 2>&1 || t=$?
            sum="$sum | test: $(grep -E 'Executed [0-9]+ tests' /tmp/test.log | tail -1 | sed 's/^[[:space:]]*//')"
          fi
          echo "$sum"   # chỉ đếm, không in code
          { echo "### CI iOS \`${{ inputs.ref }}\` — $sum"; echo '```';
            grep -E ' error: ' /tmp/build.log | sed 's#.*/vibecut/##' | sort -u | head -30
            grep -E "' failed \(|error: -\[" /tmp/test.log 2>/dev/null | sed 's#.*/vibecut/##' | head -30; echo '```'; } > /tmp/report.md
          gh api repos/nguyenphp/vibecut/commits/$(git rev-parse HEAD)/comments -F body=@/tmp/report.md >/dev/null 2>&1 || echo "không gửi được báo cáo"
          [ $b = 0 ] && [ $t = 0 ]

  android:
    if: contains(inputs.platforms, 'android')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env: { GH_TOKEN: '${{ secrets.VIBECUT_PAT }}' }
    steps:
      - uses: actions/checkout@v4
        with: { repository: nguyenphp/vibecut, ref: '${{ inputs.ref }}', token: '${{ secrets.VIBECUT_PAT }}', path: vibecut }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: compile + unit test
        working-directory: vibecut/android
        env:
          TEVO_NEXUS_URL: ${{ secrets.TEVO_NEXUS_URL }}
          TEVO_NEXUS_USERNAME: ${{ secrets.TEVO_NEXUS_USERNAME }}
          TEVO_NEXUS_PASSWORD: ${{ secrets.TEVO_NEXUS_PASSWORD }}
          ORG_GRADLE_PROJECT_tevoNexusMavenUrl: ${{ secrets.TEVO_NEXUS_URL }}
          ORG_GRADLE_PROJECT_tevoNexusUsername: ${{ secrets.TEVO_NEXUS_USERNAME }}
          ORG_GRADLE_PROJECT_tevoNexusPassword: ${{ secrets.TEVO_NEXUS_PASSWORD }}
        run: |
          [ -f app/google-services.json ] || echo '{"project_info":{"project_id":"ci"},"client":[]}' > /dev/null
          r=0; ./gradlew -q :app:compileDebugKotlin :app:testDebugUnitTest > /tmp/android.log 2>&1 || r=$?
          sum="android: $([ $r = 0 ] && echo xanh || echo ĐỎ)"; echo "$sum"
          { echo "### CI Android \`${{ inputs.ref }}\` — $sum"; echo '```'; grep -E '^e: |FAILED|What went wrong|Could not|> ' -A3 /tmp/android.log | sed 's#.*/vibecut/##' | head -60; echo '```'; } > /tmp/report.md
          gh api repos/nguyenphp/vibecut/commits/$(git rev-parse HEAD)/comments -F body=@/tmp/report.md >/dev/null 2>&1 || echo "không gửi được báo cáo"
          [ $r = 0 ]
